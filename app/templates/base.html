<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Word Tree{% endblock %}</title>
<meta name="csrf-token" content="{{ csrf_token() }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        ink: '#3f3a4d', 'ink-soft': '#7a7488', paper: '#ffffff',
        field: '#f4f2f7', line: '#e6e2ee', purple: '#8a5cf5',
        'purple-deep': '#6f45d8', lav: '#efedf3', gold: '#f5b731', danger: '#d6544f',
      },
      fontFamily: {
        sans: ['DM Sans', 'system-ui', 'sans-serif'],
        display: ['Baloo 2', 'system-ui', 'sans-serif'],
      },
    },
  },
};
</script>
{% block head %}{% endblock %}
</head>
<body class="font-sans text-ink bg-field {% block body_class %}{% endblock %}">
{% block layout %}{% endblock %}

<div id="flash-stack" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 items-end">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="rounded-xl px-4 py-2.5 text-sm font-medium shadow-lg
        {% if category == 'error' %}bg-danger text-white
        {% elif category == 'success' %}bg-emerald-600 text-white
        {% else %}bg-ink text-white{% endif %}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
</div>

<script>
setTimeout(() => document.querySelectorAll('#flash-stack > div').forEach(n => n.remove()), 5000);
</script>
{% block scripts %}{% endblock %}
</body>
</html>
